

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="ashui-module" content="rayde.wasm">
  <title>RayDE - Integrated Development Environment For The Haxe Programming Language</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap"
    rel="stylesheet">
  <style>
    body {
      margin: 0%;
      font-family: "Arimo", sans-serif;
      background-color: #181C22;
      margin-bottom: 10px;
    }

    footer {
      margin-top: 4rem;
      height: 80px;
    }

    .rayde {
      display: block;
      width: 100%;
      background: radial-gradient(circle at 12% 0%, rgba(234, 130, 32, 0.10), rgba(234, 130, 32, 0) 55%);
    }

    a {
      color: #F97316;
      text-decoration: none;
    }

    .header {
      display: block;
      padding: 16px;
      margin: auto;
      padding-top: 120px;
      max-width: 1024px;
    }

    .header-wrapper {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
    }

    .header nav a {
      font-size: 1rem;
    }

    section {
      max-width: 1024px;
      margin: auto;
    }

    .hero {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
    }

    .hero h1 {
      color: #F2F4F7;
      font-size: 3rem;
    }

    .hero p {
      font-size: 20px;
      color: #A9B0BD;
    }


    .hero-left {
      margin-top: 4rem;
      line-height: 1rem;
    }

    .hero-cta {
      display: flex;
      flex-direction: row;
      gap: 2rem;
      margin-top: 3rem;
    }

    button {
      padding: 1rem;
      padding-inline: 2rem;
      font-size: 1rem;
      border-radius: 40px;
      background: none;
    }

    .hero-cta button {
      border: 1px solid #ffffff50;
    }

    .hero button.download {
      background-color: #F2F4F7;
    }

    .hero button.try {
      color: #F2F4F7;
    }

    .demo {
      background-color: #0F1216;
      border-radius: 8px;
      display: block;
      height: 640px;
      margin-top: 4rem;
      margin-bottom: 4rem;
      box-shadow: 0 2px 4px 0 #00000026, 0 12px 20px 0 #00000038;
    }

    #screen {
      position: relative;
      inset: 0;
      display: block;
      outline: none;
      width: 100%;
      height: 100%;
    }

    #status {
      width: 100%;
      height: 100%;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: .6rem;
      text-align: center;
      font: 15px/1.5 system-ui, sans-serif;
      color: #e8e9ee;
      transition: opacity .25s;
    }

    #status[hidden] {
      display: none;
    }

    #status.fading {
      opacity: 0;
      pointer-events: none;
    }

    #status h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }

    #status p {
      margin: 0;
      max-width: 34rem;
      color: var(--muted);
    }

    #status button {
      margin-top: .4rem;
      padding: .45rem 1rem;
      font: inherit;
      color: var(--page);
      background: var(--accent);
      border: 0;
      border-radius: .5rem;
      cursor: pointer;
    }

    .spinner {
      width: 1.6rem;
      height: 1.6rem;
      border: 2px solid var(--muted);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    #status.failed .spinner {
      display: none;
    }

    #out {
      display: none;
      margin: 0;
    }

    .spinner {
      width: 1.6rem;
      height: 1.6rem;
      border: 2px solid #9a9cab;
      border-top-color: #6d8cff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    #status.failed .spinner {
      display: none;
    }
  </style>


</head>

<body>
  <div class="rayde">
    <header class="header">
      <div class="header-wrapper">
        <img src="assets/rayde_dark_transparent_final.svg" width="200px" height="auto" />
        <nav style="display:flex;gap:26px;font-size:14px">
          <a href="/docs" style="color:#9AA0AA" class="dch7">Docs</a>
          <a href="#features" style="color:#9AA0AA" class="dch7">Features</a>
          <a href="#install" style="color:#9AA0AA" class="dch7">Install</a>
        </nav>
      </div>
    </header>
    <section class="hero">
      <div class="hero-left">
        <h1>A Powerful IDE for Haxe</h1>
        <p>Built with Haxe, for a smoother Haxe experience.</p>

        <div class="hero-cta">
          <button class="download">Download</button>
          <button class="try">Try it online</button>
        </div>
      </div>
      <img style="margin-right: -0.5%;" src="assets/rayde-icon.svg" width="150px" height="150px" />
    </section>
    <section class="demo">
      <div id="status" role="status" aria-live="polite">
        <div class="spinner"></div>
        <h1 id="status-title">Starting</h1>
        <p id="status-detail"></p>
      </div>
      <canvas id="screen" tabindex="0" data-xwindow="fit"></canvas>
      <pre id="out"></pre>
    </section>
    <footer></footer>
  </div>
</body>
<script src="./dist/rayde-platform.js"></script>
<script type="module" src="./dist/ashui-host.mjs"></script>
