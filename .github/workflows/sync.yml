name: Cloud Sync engine

on:
  push:
    paths:
      - native/sync/**
      - .github/workflows/sync.yml
  pull_request:
    paths:
      - native/sync/**
      - .github/workflows/sync.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUSTUP_TOOLCHAIN: nightly-2026-10-06

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: native/sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the locked Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: native/sync
      # The scan tests make Git repositories, and the link tests need a system that may refuse to make links.
      - name: Test the scan, merge and link code
        run: cargo test --locked
