name: Windows package check

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Distribution run containing a failed Windows package
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Download the failed archive
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id }}
        run: gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name failed-package-windows-x86_64 --dir package
      - name: Capture Windows startup crashes
        shell: pwsh
        run: |
          $folder = New-Item -ItemType Directory -Force crash-reports
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\RayDE.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value $folder.FullName -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -Value 2 -PropertyType DWord -Force | Out-Null
      - name: Check the extracted package
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import subprocess
          import sys
          archives = list(Path('package').glob('*.zip'))
          if len(archives) != 1:
              raise SystemExit('Expected one Windows package archive')
          archive = archives[0]
          expected = archive.with_name(archive.name + '.sha256').read_text().split()[0]
          with archive.open('rb') as stream:
              actual = hashlib.file_digest(stream, 'sha256').hexdigest()
          if actual != expected:
              raise SystemExit('Package checksum mismatch')
          subprocess.run([sys.executable, 'tests/distribution_smoke.py', str(archive), '--platform', 'windows'], check=True)
          PY
      - name: Inspect a startup crash
        if: failure()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-10)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -like '*RayDE.exe*' } |
            Format-List TimeCreated, Id, Message | Out-String | Tee-Object crash-reports/events.txt
          $dump = Get-ChildItem crash-reports -Filter '*.dmp' | Select-Object -First 1
          $debugger = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits" -Filter cdb.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          if ($dump -and $debugger) {
            $archive = Get-ChildItem package -Filter '*.zip' | Select-Object -First 1
            Expand-Archive -LiteralPath $archive.FullName -DestinationPath debug-package
            $program = Get-ChildItem debug-package -Filter RayDE.exe -Recurse | Select-Object -First 1
            & $debugger.FullName -z $dump.FullName -logo crash-reports/debugger.txt -c ".symfix; .exepath+ $($program.DirectoryName); .reload; .ecxr; k; r; u @rip-20 L30; lm; q"
          } else {
            Write-Output "Crash dump: $($dump.FullName); debugger: $($debugger.FullName)"
          }
      - name: Remove temporary memory dumps
        if: always()
        shell: pwsh
        run: Get-ChildItem crash-reports -Filter '*.dmp' -ErrorAction SilentlyContinue | Remove-Item -Force
      - name: Preserve startup crash reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-startup-crash
          path: |
            crash-reports/events.txt
            crash-reports/debugger.txt
          if-no-files-found: warn
          retention-days: 5
