name: Distribution

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Package version (defaults to haxelib.json)
        type: string

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  RUSTUP_TOOLCHAIN: nightly-2026-10-06
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python3 tests/distribution_checks.py
      - run: for script in scripts/*.sh; do bash -n "$script"; done

  package:
    needs: contracts
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: macos, arch: aarch64, runner: macos-15}
          - {platform: macos, arch: x86_64, runner: macos-15-intel}
          - {platform: linux, arch: x86_64, runner: ubuntu-24.04}
          - {platform: windows, arch: x86_64, runner: windows-2022}
    defaults:
      run:
        shell: bash
        working-directory: RayDE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: RayDE
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: krdlab/setup-haxe@18e4b483cfffca2fb8881530bf8a6cec39dac8fb # v2
        with:
          haxe-version: 4.3.6
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - name: Check out locked dependencies and install Haxe libraries
        run: python3 scripts/ci-deps.py --fetch --env-file "$GITHUB_ENV"
      - name: Install the locked Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install native headers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libudev-dev fonts-dejavu-core patchelf
      - uses: ./ash/.github/actions/llvm21
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: distribution-${{ matrix.platform }}-${{ matrix.arch }}
          workspaces: |
            ash -> target
            hlwgpu -> target
            hlwindow -> target
            rayzor -> target
            RayDE/.deps/ashui-3d0851d888eb741c695a805f11d1f4a5aba97e71 -> target
            RayDE/native/terminal -> target
            RayDE/native/rayscript -> ../../../rayscript/target
      - name: Build runtimes, language server and UI libraries
        run: python3 scripts/ci-deps.py --build --env-file "$GITHUB_ENV"
      - name: Choose package version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: python3 scripts/release-version.py >> "$GITHUB_ENV"
      - name: Package
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: bash scripts/ci-package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rayde-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            RayDE/dist/*.zip
            RayDE/dist/*.tar.gz
            RayDE/dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: rayde-*
          path: dist
          merge-multiple: true
      - name: Verify checksums and prepare a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum --check *.sha256
          cat *.sha256 > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" --json isDraft > release.json; then
            test "$(jq -r .isDraft release.json)" = true
            rm release.json
            gh release upload "$GITHUB_REF_NAME" --clobber ./*.zip ./*.tar.gz ./*.sha256 SHA256SUMS
          else
            rm -f release.json
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "RayDE $GITHUB_REF_NAME" --generate-notes ./*.zip ./*.tar.gz ./*.sha256 SHA256SUMS
          fi
