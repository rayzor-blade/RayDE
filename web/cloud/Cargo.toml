[package]
name = "rayde-cloud"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "=0.8.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
futures-util = "0.3"
futures-channel = "0.3"
rayde-session = { path = "../../native/session", default-features = false }

[profile.release]
opt-level = "s"
lto = true
