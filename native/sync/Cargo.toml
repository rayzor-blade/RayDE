[package]
name = "rayde-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "RayDE Cloud Sync: workspace identity, sharing policy, expiry and quota rules, the snapshot manifest, and the desktop engine that scans and chunks a Git working tree."

[lib]
name = "rayde_sync"
path = "src/lib.rs"

[features]
default = ["scan", "client"]
# The desktop side: reads a working tree and runs `git`. Left out, the crate is pure data and rules and builds for wasm32 for the Worker.
scan = ["dep:ignore"]
# The upload client: scans a folder and sends it to a gateway.
client = ["scan", "dep:ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "=2.12.1", default-features = false, features = ["tls", "json"], optional = true }
ignore = { version = "=0.4.23", optional = true }

[[example]]
name = "push"
required-features = ["client"]

[dev-dependencies]
tempfile = "3"
