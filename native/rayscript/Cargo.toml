[package]
name = "rayde-rayscript"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rayde-extension-host"
path = "src/host.rs"

[dependencies]
hl_abi = { git = "https://github.com/rayzor-blade/hl_abi" }
rayscript-host = { path = "../../../rayscript/crates/rayscript-host" }
rayscript-vm = { path = "../../../rayscript/crates/rayscript-vm" }
pulldown-cmark = "=0.13.4"
serde_json = "1.0"
toml = "=0.8.23"
toml_edit = "=0.22.27"
irosashi = { version = "=0.3.0", default-features = false }
include_dir = "=0.7.4"
latex-rust = { version = "=3.0.1", default-features = false }
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
scraper = { version = "=0.27.0", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png", "bmp", "gif", "ico"] }
avif-decode = { version = "=3.0.0", default-features = false }

[profile.release]
debug = 1
