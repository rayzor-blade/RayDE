[package]
name = "rayde-jam"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[dependencies]
yrs = { version = "=0.28.0", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
tokio-tungstenite = "=0.28.0"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "=0.3.4"
crc32fast = "=1.5.3"
