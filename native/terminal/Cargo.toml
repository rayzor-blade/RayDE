[package]
name = "rayde-terminal"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["ffi"]
ffi = ["dep:hl_abi"]

[dependencies]
hl_abi = { git = "https://github.com/rayzor-blade/hl_abi", optional = true }
portable-pty = "0.9"
vt100 = "0.15"
libc = "0.2"
